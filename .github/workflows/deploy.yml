name: Deploy a Cloudflare

# Cada push a main despliega el Worker taquilla-m52 en la cuenta de M52.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos pushes seguidos, solo corre el último deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones de D1
        run: npx wrangler d1 migrations apply taquilla-m52 --remote

      - name: Desplegar Worker
        run: npx wrangler deploy
